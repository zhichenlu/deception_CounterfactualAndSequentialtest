<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Intent Judgment Study</title>
<style>
  :root{
    --paper:#EDEFF1; --card:#FFFFFF; --ink:#191C20; --ink-soft:#5B626B;
    --canvas-bg:#12151A; --canvas-grid:#1C2027;
    --accent:#4F52C4; --accent-ink:#FFFFFF; --line:#D6DADF; --ok:#2E7D5B;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:var(--paper); color:var(--ink); font-size:16px; line-height:1.7;
  }
  .mono{font-family:ui-monospace, "SF Mono", Consolas, monospace;}
  .wrap{max-width:980px; margin:0 auto; padding:28px 20px 60px;}
  h1{font-size:1.35rem; font-weight:650;}
  h2{font-size:1.05rem; font-weight:650; margin-bottom:10px;}
  p{margin-bottom:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px; margin-top:18px;}
  .muted{color:var(--ink-soft); font-size:.9rem;}
  button{font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:9px 18px; cursor:pointer;}
  button:hover{border-color:var(--ink-soft);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  button.primary:hover{filter:brightness(1.07);}
  button:disabled{opacity:.45; cursor:default;}
  button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  input[type=text]{font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; width:220px; background:#FBFCFD;}
  input[type=text]:focus-visible{outline:2px solid var(--accent);}
  label{font-weight:550;}
  .row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin:10px 0;}
  .hidden{display:none !important;}
  .topbar{display:flex; justify-content:space-between; align-items:center;}
  .lang{font-size:.85rem; color:var(--ink-soft);}
  .lang a{color:var(--accent); text-decoration:none; margin-left:8px;}
  .trial-head{display:flex; justify-content:space-between; align-items:baseline; margin-top:18px;}
  .trial-head .mono{color:var(--ink-soft); font-size:.85rem;}
  #stage-box{position:relative; margin-top:10px;}
  canvas{display:block; width:100%; height:auto; border-radius:var(--radius); border:1px solid #262B33; background:var(--canvas-bg);}
  .controls{display:flex; gap:12px; margin-top:12px; align-items:center;}
  #commit-state{color:var(--ok); font-weight:600; font-size:.92rem;}
  .overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(18,21,26,.55); border-radius:var(--radius);}
  .panel{background:var(--card); border-radius:var(--radius); padding:22px 26px; width:min(560px, 92%); box-shadow:0 18px 50px rgba(10,12,16,.35);}
  .panel h2{margin-bottom:4px;}
  .panel .muted{margin-bottom:14px;}
  .slider-row{display:grid; grid-template-columns:110px 1fr 52px; gap:12px; align-items:center; margin:10px 0;}
  .slider-row .val{text-align:right;}
  input[type=range]{width:100%; accent-color:var(--accent); height:22px;}
  .divider{border-top:1px solid var(--line); margin:16px 0;}
  .choice-grid{display:flex; gap:10px; margin:8px 0 4px;}
  .choice-grid button{min-width:64px; font-weight:600;}
  .retro-opt{display:block; margin:7px 0; font-weight:400; cursor:pointer;}
  .retro-opt input{margin-right:9px; accent-color:var(--accent);}
  .panel .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <section id="screen-intro">
    <div class="topbar">
      <h1 data-i18n="title"></h1>
      <div class="lang" id="lang-switch"></div>
    </div>
    <div class="card">
      <div id="intro-text"></div>
      <div class="divider"></div>
      <h2 data-i18n="taskHead"></h2>
      <p data-i18n-html="task1"></p>
      <p data-i18n-html="task2"></p>
      <p data-i18n="task3"></p>
      <div class="divider"></div>
      <div class="row">
        <label for="pid" data-i18n="pidLabel"></label>
        <input type="text" id="pid" autocomplete="off" data-i18n-ph="pidPh">
      </div>
      <div class="row" id="cond-row">
        <label data-i18n="condLabel"></label>
        <button data-cond="MAR" data-i18n="condMAR"></button>
        <button data-cond="ABS" data-i18n="condABS"></button>
        <span class="muted" id="cond-note"></span>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="primary" id="btn-start" disabled data-i18n="start"></button>
      </div>
    </div>
    <p class="muted" style="margin-top:14px" data-i18n="privacy"></p>
  </section>

  <section id="screen-trial" class="hidden">
    <div class="trial-head">
      <h1 id="trial-title"></h1>
      <span class="mono" id="trial-clock">t = 0 s</span>
    </div>
    <div id="stage-box">
      <canvas id="stage" width="960" height="1060"></canvas>

      <div id="probe" class="overlay hidden">
        <div class="panel">
          <h2 data-i18n="probeHead"></h2>
          <p class="muted" data-i18n="probeSub"></p>
          <div class="slider-row"><label for="s-A" data-i18n="goalA"></label><input type="range" id="s-A" min="0" max="100" value="33"><span class="val mono" id="v-A">33</span></div>
          <div class="slider-row"><label for="s-B" data-i18n="goalB"></label><input type="range" id="s-B" min="0" max="100" value="33"><span class="val mono" id="v-B">33</span></div>
          <div class="slider-row"><label for="s-C" data-i18n="goalC"></label><input type="range" id="s-C" min="0" max="100" value="33"><span class="val mono" id="v-C">33</span></div>
          <div class="divider"></div>
          <div class="slider-row"><label for="s-M" data-i18n="misleadLabel"></label><input type="range" id="s-M" min="0" max="100" value="0"><span class="val mono" id="v-M">0</span></div>
          <p class="muted" style="margin-top:4px" data-i18n="misleadSub"></p>
          <div class="actions"><button class="primary" id="btn-probe-ok" data-i18n="continue"></button></div>
        </div>
      </div>

      <div id="commit-box" class="overlay hidden">
        <div class="panel">
          <h2 data-i18n="commitHead"></h2>
          <p class="muted" data-i18n="commitSub"></p>
          <div class="choice-grid" id="commit-goals">
            <button data-g="A">A</button><button data-g="B">B</button><button data-g="C">C</button>
          </div>
          <div class="actions"><button id="btn-commit-cancel" data-i18n="back"></button></div>
        </div>
      </div>

      <div id="retro" class="overlay hidden">
        <div class="panel">
          <h2 data-i18n="retroHead"></h2>
          <p class="muted" data-i18n="retroSub"></p>
          <label class="retro-opt"><input type="radio" name="retro" value="single"><span data-i18n="retroSingle"></span></label>
          <label class="retro-opt"><input type="radio" name="retro" value="changed"><span data-i18n="retroChanged"></span></label>
          <label class="retro-opt"><input type="radio" name="retro" value="disguise"><span data-i18n="retroDisguise"></span></label>
          <label class="retro-opt"><input type="radio" name="retro" value="unsure"><span data-i18n="retroUnsure"></span></label>
          <div class="divider"></div>
          <p class="muted" data-i18n="retroGoal"></p>
          <div class="choice-grid" id="retro-goals">
            <button data-g="A">A</button><button data-g="B">B</button><button data-g="C">C</button>
          </div>
          <div class="actions"><button class="primary" id="btn-retro-ok" disabled data-i18n="next"></button></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="btn-commit" data-i18n="commit"></button>
      <span id="commit-state"></span>
    </div>
  </section>

  <section id="screen-done" class="hidden">
    <h1 data-i18n="doneHead"></h1>
    <div class="card">
      <p data-i18n="doneText"></p>
      <div class="row">
        <button class="primary" id="btn-download" data-i18n="download"></button>
        <span class="muted mono" id="done-meta"></span>
      </div>
    </div>
  </section>
</div>

    start: "Start practice", privacy: "Data are generated on this page only and can be downloaded at the end.",
    practice: "Practice trial", trial: (i, n) => `Trial ${i} / ${n}`,
    probeHead: "Please rate", probeSub: "For each goal: confidence that it is the true destination (0–100).",
    goalA: "Goal A", goalB: "Goal B", goalC: "Goal C",
    misleadLabel: "Misleading", misleadSub: "How far the motion appears to be deliberately misleading the observer.",
    continue: "Continue", commit: "Commit", commitHead: "Commit", commitSub: "The true destination you are sure of:", back: "Back",
    committed: (g, t) => `Committed: ${g} (t = ${t} s)`,
    retroHead: "Replay finished", retroSub: "Looking back at the whole track, which description fits best?",
    retroSingle: "It moved toward the same goal throughout", retroChanged: "It genuinely changed its goal midway",
    retroDisguise: "It first disguised itself as heading elsewhere; its real goal never changed", retroUnsure: "Cannot tell",
    retroGoal: "Its final true destination:", next: "Next trial",
    doneHead: "Study complete", doneText: "Thank you for participating. Please download your data file and send it to the experimenter.",
    download: "Download data (JSON)",
  }
};
const params = new URLSearchParams(location.search);
const LANG = (params.get("lang") === "en" || params.get("lang") === "zh") ? params.get("lang") : "en";
const S = STR[LANG];
const DEMO = params.get("demo") === "1";
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
document.title = S.title;
for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = S[el.dataset.i18n];
for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = S[el.dataset.i18nHtml];
for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = S[el.dataset.i18nPh];
{
  const q = new URLSearchParams(location.search);
  const mk = (l) => { q.set("lang", l); return "?" + q.toString(); };
  document.getElementById("lang-switch").innerHTML =
    LANG === "zh" ? `中文 <a href="${mk("en")}">English</a>` : `English <a href="${mk("zh")}">中文</a>`;
}

/* ================= state ================= */
let cond = null, pid = "", order = [], cursor = 0, record = null;
let cur = null, curRec = null, worldT = 0, playing = false, lastTs = null, nextProbe = 0, committed = false;

/* ================= utilities ================= */
const $ = (id) => document.getElementById(id);
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function lerp(a, b, f){ return a + (b - a) * f; }
function lerpAngle(a, b, f){ let d = ((b - a + 540) % 360) - 180; return a + d * f; }

/* ================= rendering ================= */
const cv = $("stage"), ctx = cv.getContext("2d");
const WORLD = { x0:-1650, x1:1650, y0:-250, y1:3350 };
function toScreen(x, y){
  return [(x - WORLD.x0) / (WORLD.x1 - WORLD.x0) * cv.width,
          (1 - (y - WORLD.y0) / (WORLD.y1 - WORLD.y0)) * cv.height];
}
function sampleAt(t){
  const s = cur.samples;
  if (t <= s[0][0]) return s[0];
  const last = s[s.length - 1];
  if (t >= last[0]) return last;
  let i = 1; while (s[i][0] < t) i++;
  const a = s[i - 1], b = s[i], f = (t - a[0]) / (b[0] - a[0]);
  return [t, lerp(a[1], b[1], f), lerp(a[2], b[2], f), lerpAngle(a[3], b[3], f)];
}
function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "#1C2027"; ctx.lineWidth = 1;
  for (let gx = -1500; gx <= 1500; gx += 500){ const [sx] = toScreen(gx, 0); ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, cv.height); ctx.stroke(); }
  for (let gy = 0; gy <= 3000; gy += 500){ const [, sy] = toScreen(0, gy); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cv.width, sy); ctx.stroke(); }
  const ob = cur.truth.obstacle;
  if (ob){
    const [ox, oy] = toScreen(ob[0], ob[1]); const r = ob[2] / (WORLD.x1 - WORLD.x0) * cv.width;
    ctx.fillStyle = "rgba(120,128,138,0.28)"; ctx.strokeStyle = "rgba(150,158,168,0.7)"; ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(ox, oy, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.font = "600 24px ui-monospace, monospace";
  for (const g of DATA.scene.goals){
    const [gx, gy] = toScreen(g.x, g.y);
    ctx.strokeStyle = "#8E99A6"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(gx, gy, 15, 0, 7); ctx.stroke();
    ctx.fillStyle = "#B7C0CA"; ctx.fillText(g.id, gx + 22, gy + 8);
  }
  if (CONFIG.TRAIL){
    ctx.strokeStyle = "rgba(124,141,163,0.85)"; ctx.lineWidth = 2; ctx.beginPath();
    let started = false;
    for (const s of cur.samples){
      if (s[0] > worldT) break;
      const [sx, sy] = toScreen(s[1], s[2]);
      if (!started){ ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
    }
    const nowS = sampleAt(worldT); const [nx, ny] = toScreen(nowS[1], nowS[2]);
    if (started) ctx.lineTo(nx, ny);
    ctx.stroke();
  }
  const s = sampleAt(worldT);
  const [ax, ay] = toScreen(s[1], s[2]);
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.PI / 2 - s[3] * Math.PI / 180);
  ctx.fillStyle = "#F4F6F8"; ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(8.5, 11); ctx.lineTo(-8.5, 11); ctx.closePath(); ctx.fill();
  ctx.restore();
  $("trial-clock").textContent = `t = ${Math.floor(worldT)} s`;
}

/* ================= playback ================= */
function tick(ts){
  if (!playing) return;
  if (lastTs === null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.1); lastTs = ts;
  worldT += dt * CONFIG.TIME_SCALE;
  if (worldT >= cur.duration){ worldT = cur.duration; draw(); endTrialPlayback(); return; }
  if (worldT >= nextProbe){ draw(); openProbe(); return; }
  draw(); requestAnimationFrame(tick);
}
function resume(){ playing = true; lastTs = null; requestAnimationFrame(tick); }

/* ================= probe ================= */
for (const k of ["A", "B", "C", "M"]) $("s-" + k).addEventListener("input", () => { $("v-" + k).textContent = $("s-" + k).value; });
function openProbe(){ playing = false; $("probe").classList.remove("hidden"); $("btn-probe-ok").focus(); }
$("btn-probe-ok").addEventListener("click", () => {
  curRec.probes.push({ t: Math.round(worldT), beliefs: { A: +$("s-A").value, B: +$("s-B").value, C: +$("s-C").value }, misleading: +$("s-M").value });
  $("probe").classList.add("hidden"); nextProbe += CONFIG.PROBE_INTERVAL; resume();
});

/* ================= commit ================= */
$("btn-commit").addEventListener("click", () => { if (committed) return; playing = false; $("commit-box").classList.remove("hidden"); });
$("btn-commit-cancel").addEventListener("click", () => { $("commit-box").classList.add("hidden"); resume(); });
for (const b of $("commit-goals").querySelectorAll("button")){
  b.addEventListener("click", () => {
    committed = true; curRec.commit = { t: Math.round(worldT), goal: b.dataset.g };
    $("commit-box").classList.add("hidden"); $("btn-commit").disabled = true;
    $("commit-state").textContent = S.committed(b.dataset.g, Math.round(worldT)); resume();
  });
}

/* ================= retrospective ================= */
let retroGoal = null;
function endTrialPlayback(){
  playing = false; retroGoal = null;
  for (const b of $("retro-goals").querySelectorAll("button")) b.classList.remove("sel");
  for (const r of document.querySelectorAll("input[name=retro]")) r.checked = false;
  $("btn-retro-ok").disabled = true; $("retro").classList.remove("hidden");
}
function retroReady(){ const p = document.querySelector("input[name=retro]:checked"); $("btn-retro-ok").disabled = !(p && retroGoal); }
for (const r of document.querySelectorAll("input[name=retro]")) r.addEventListener("change", retroReady);
for (const b of $("retro-goals").querySelectorAll("button")){
  b.addEventListener("click", () => { retroGoal = b.dataset.g; for (const x of $("retro-goals").querySelectorAll("button")) x.classList.toggle("sel", x === b); retroReady(); });
}
$("btn-retro-ok").addEventListener("click", () => {
  const p = document.querySelector("input[name=retro]:checked");
  curRec.retro = { explain: p.value, finalGoal: retroGoal };
  curRec.durMs = Date.now() - curRec._t0; delete curRec._t0;
  record.trials.push(curRec); $("retro").classList.add("hidden"); cursor += 1; nextTrial();
});

/* ================= trial flow ================= */
function resetSliders(){ for (const [k, v] of [["A", 33], ["B", 33], ["C", 33], ["M", 0]]){ $("s-" + k).value = v; $("v-" + k).textContent = v; } }
function startTrial(trial, label){
  cur = trial; curRec = { id: trial.id, order: cursor, probes: [], commit: null, retro: null, _t0: Date.now() };
  worldT = 0; nextProbe = CONFIG.PROBE_INTERVAL; committed = false;
  $("btn-commit").disabled = false; $("commit-state").textContent = ""; $("trial-title").textContent = label;
  resetSliders(); draw(); resume();
}
function nextTrial(){
  if (cursor >= order.length){ finish(); return; }
  const idx = order[cursor];
  if (idx === -1) startTrial(DATA.practice, S.practice);
  else startTrial(DATA.trials[idx], S.trial(cursor, order.length - 1));
}

/* ================= finish & export ================= */
function finish(){
  $("screen-trial").classList.add("hidden"); $("screen-done").classList.remove("hidden");
  record.finishedAt = new Date().toISOString();
  $("done-meta").textContent = `${record.pid} · ${record.cond} · ${record.lang} · ${record.trials.length} trials`;
  saveData(record);
}
function saveData(rec){ /* backend upload hook — local download only for now */ window.__lastRecord = rec; }
$("btn-download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(record, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `intent_${record.pid}_${record.cond}_${record.lang}.json`; a.click(); URL.revokeObjectURL(a.href);
});

/* ================= intro wiring ================= */
function setCond(c){
  cond = c; $("intro-text").innerHTML = c === "MAR" ? S.framingMAR : S.framingABS;
  for (const b of $("cond-row").querySelectorAll("button")) b.classList.toggle("sel", b.dataset.cond === c);
  checkReady();
}
function checkReady(){ $("btn-start").disabled = !(cond && $("pid").value.trim()); }
for (const b of $("cond-row").querySelectorAll("button")) b.addEventListener("click", () => setCond(b.dataset.cond));
$("pid").addEventListener("input", checkReady);
$("btn-start").addEventListener("click", () => {
  pid = $("pid").value.trim();
  const rnd = mulberry32(hashStr(pid + "|" + cond));
  order = shuffle([...DATA.trials.keys()], rnd); order.unshift(-1);
  record = { pid, cond, lang: LANG, timeScale: CONFIG.TIME_SCALE, probeInterval: CONFIG.PROBE_INTERVAL,
             startedAt: new Date().toISOString(), ua: navigator.userAgent, trials: [] };
  cursor = 0; $("screen-intro").classList.add("hidden"); $("screen-trial").classList.remove("hidden"); nextTrial();
});

/* ================= demo shortcuts (?demo=1 only) ================= */
if (DEMO){
  document.addEventListener("keydown", (e) => {
    if (!cur || $("screen-trial").classList.contains("hidden")) return;
    if (e.key === "s" || e.key === "S"){      // skip to end of this trial
      $("probe").classList.add("hidden"); $("commit-box").classList.add("hidden");
      playing = false; worldT = cur.duration; nextProbe = Infinity; draw(); endTrialPlayback();
    }
    if (e.key === "f" || e.key === "F"){ CONFIG.TIME_SCALE = CONFIG.TIME_SCALE === 8 ? 24 : 8; }  // toggle fast
  });
}

/* ================= boot ================= */
{
  const urlCond = (params.get("cond") || "").toUpperCase();
  if (urlCond === "MAR" || urlCond === "ABS"){ setCond(urlCond); $("cond-note").textContent = S.condByLink; }
  else $("intro-text").innerHTML = S.pickCond;
  if (params.get("pid")) { $("pid").value = params.get("pid"); }
  checkReady();
}
</script>
</body>
</html>
