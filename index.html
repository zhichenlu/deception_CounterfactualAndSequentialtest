<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动意图判断实验</title>
<style>
  :root{
    --paper:#EDEFF1; --card:#FFFFFF; --ink:#191C20; --ink-soft:#5B626B;
    --canvas-bg:#12151A; --canvas-grid:#1C2027;
    --accent:#4F52C4; --accent-ink:#FFFFFF; --line:#D6DADF; --ok:#2E7D5B;
    --danger:#B3261E; --danger-ink:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:var(--paper); color:var(--ink); font-size:16px; line-height:1.7;
  }
  .mono{font-family:ui-monospace, "SF Mono", Consolas, monospace;}
  .wrap{max-width:980px; margin:0 auto; padding:20px 20px 40px;}
  h1{font-size:1.35rem; font-weight:650;}
  h2{font-size:1.05rem; font-weight:650; margin-bottom:10px;}
  p{margin-bottom:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px; margin-top:18px;}
  .muted{color:var(--ink-soft); font-size:.9rem;}
  button{font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:9px 18px; cursor:pointer;}
  button:hover{border-color:var(--ink-soft);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  button.primary:hover{filter:brightness(1.07);}
  button.danger{background:var(--danger); color:var(--danger-ink); border-color:var(--danger); font-weight:600;}
  button.danger:hover{filter:brightness(1.08);}
  button:disabled{opacity:.45; cursor:default;}
  button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  input[type=text], input[type=number], select{font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; width:220px; background:#FBFCFD;}
  input[type=number]{width:100px;}
  input[type=text]:focus-visible, input[type=number]:focus-visible, select:focus-visible{outline:2px solid var(--accent);}
  label{font-weight:550;}
  .row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin:10px 0;}
  .hidden{display:none !important;}
  .topbar{display:flex; justify-content:space-between; align-items:center;}
  .lang{font-size:.85rem; color:var(--ink-soft);}
  .lang a{color:var(--accent); text-decoration:none; margin-left:8px;}
  .trial-head{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px;}
  .trial-head .mono{color:var(--ink-soft); font-size:.85rem;}
  #stage-box{position:relative; margin-top:10px; max-width:100%; display:flex; justify-content:center;}
  canvas{
    display:block;
    height:min(70vh, 900px);
    width:auto;
    max-width:100%;
    aspect-ratio: 960 / 1060;
    border-radius:var(--radius); border:1px solid #262B33; background:var(--canvas-bg);
  }
  .controls{display:flex; gap:12px; margin-top:12px; align-items:center; flex-wrap:wrap;}
  #probe-state{color:var(--ok); font-weight:600; font-size:.92rem;}
  .overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(18,21,26,.55); border-radius:var(--radius);}
  .panel{background:var(--card); border-radius:var(--radius); padding:22px 26px; width:min(560px, 92%); box-shadow:0 18px 50px rgba(10,12,16,.35); max-height:90%; overflow-y:auto;}
  .panel h2{margin-bottom:4px;}
  .panel .muted{margin-bottom:14px;}
  .slider-row{display:grid; grid-template-columns:110px 1fr 52px; gap:12px; align-items:center; margin:10px 0;}
  .slider-row .val{text-align:right;}
  input[type=range]{width:100%; accent-color:var(--accent); height:22px;}
  .divider{border-top:1px solid var(--line); margin:16px 0;}
  .choice-grid{display:flex; gap:10px; margin:8px 0 4px;}
  .choice-grid button{min-width:64px; font-weight:600;}
  .retro-opt{display:block; margin:7px 0; font-weight:400; cursor:pointer;}
  .retro-opt input{margin-right:9px; accent-color:var(--accent);}
  .q-block{margin-top:18px;}
  .q-block > p.q-text{font-weight:550; margin-bottom:4px;}
  .q-block > p.muted{margin-bottom:8px;}
  .scale-row{margin-top:6px;}
  .scale-buttons{display:flex; gap:6px;}
  .scale-buttons button{flex:1 1 0; min-width:0; padding:8px 0; text-align:center; font-weight:600;}
  .scale-caps{display:flex; justify-content:space-between; gap:8px; margin-top:6px; font-size:.78rem; color:var(--ink-soft);}
  .scale-caps span:first-child{text-align:left;}
  .scale-caps span:nth-child(2){flex:0 0 auto; text-align:center;}
  .scale-caps span:last-child{text-align:right;}
  .panel .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <section id="screen-intro">
    <div class="topbar">
      <h1 data-i18n="title"></h1>
      <div class="lang" id="lang-switch"></div>
    </div>
    <div class="card">
      <div id="intro-text"></div>
      <div class="divider"></div>
      <h2 data-i18n="taskHead"></h2>
      <p data-i18n-html="task1"></p>
      <p data-i18n-html="task2"></p>
      <p data-i18n-html="task3"></p>
      <p data-i18n-html="task4"></p>
      <p class="muted" data-i18n-html="taskDuration"></p>
      <div class="divider"></div>
      <div class="row">
        <label for="pid" data-i18n="pidLabel"></label>
        <input type="text" id="pid" autocomplete="off" data-i18n-ph="pidPh">
      </div>
      <div class="row">
        <label for="gender" data-i18n="genderLabel"></label>
        <select id="gender">
          <option value="" data-i18n="genderPh"></option>
          <option value="male" data-i18n="genderMale"></option>
          <option value="female" data-i18n="genderFemale"></option>
          <option value="nonbinary" data-i18n="genderNonbinary"></option>
          <option value="prefer_not" data-i18n="genderPreferNot"></option>
        </select>
      </div>
      <div class="row">
        <label for="age" data-i18n="ageLabel"></label>
        <input type="number" id="age" min="1" max="120" data-i18n-ph="agePh">
      </div>
      <div class="row" id="license-row">
        <label data-i18n="licenseLabel"></label>
        <button data-v="yes" data-i18n="licenseYes"></button>
        <button data-v="no" data-i18n="licenseNo"></button>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="primary" id="btn-start" disabled data-i18n="start"></button>
      </div>
    </div>
    <p class="muted" style="margin-top:14px" data-i18n="privacy"></p>
  </section>

  <section id="screen-trial" class="hidden">
    <div class="trial-head">
      <h1 id="trial-title"></h1>
      <span class="mono" id="trial-clock">t = 0 s</span>
    </div>
    <div id="stage-box">
      <canvas id="stage" width="960" height="1060"></canvas>

      <div id="probe" class="overlay hidden">
        <div class="panel">
          <h2 id="probe-head" data-i18n="probeHead"></h2>
          <p class="muted" data-i18n="probeSub"></p>
          <div class="slider-row"><label for="s-A" data-i18n="goalA"></label><input type="range" id="s-A" min="0" max="100" value="0"><span class="val mono" id="v-A">0</span></div>
          <div class="slider-row"><label for="s-B" data-i18n="goalB"></label><input type="range" id="s-B" min="0" max="100" value="0"><span class="val mono" id="v-B">0</span></div>
          <div class="slider-row"><label for="s-C" data-i18n="goalC"></label><input type="range" id="s-C" min="0" max="100" value="0"><span class="val mono" id="v-C">0</span></div>
          <div class="divider"></div>
          <div class="slider-row"><label for="s-M" data-i18n="misleadLabel"></label><input type="range" id="s-M" min="0" max="100" value="0"><span class="val mono" id="v-M">0</span></div>
          <p class="muted" style="margin-top:4px" data-i18n="misleadSub"></p>
          <div class="actions"><button class="primary" id="btn-probe-ok" data-i18n="continue"></button></div>
        </div>
      </div>

      <div id="retro" class="overlay hidden">
        <div class="panel">
          <h2 data-i18n="retroHead"></h2>
          <p class="muted" data-i18n="retroSub"></p>
          <label class="retro-opt"><input type="radio" name="retro" value="single"><span data-i18n="retroSingle"></span></label>
          <label class="retro-opt"><input type="radio" name="retro" value="changed"><span data-i18n="retroChanged"></span></label>
          <label class="retro-opt"><input type="radio" name="retro" value="disguise"><span data-i18n="retroDisguise"></span></label>
          <label class="retro-opt"><input type="radio" name="retro" value="unsure"><span data-i18n="retroUnsure"></span></label>
          <div class="divider"></div>
          <p class="muted" data-i18n="retroGoal"></p>
          <div class="choice-grid" id="retro-goals">
            <button data-g="A">A</button><button data-g="B">B</button><button data-g="C">C</button>
          </div>
          <div class="divider"></div>
          <div id="retro-extra"></div>
          <div class="actions"><button class="primary" id="btn-retro-ok" disabled data-i18n="next"></button></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="danger" id="btn-manual-probe" data-i18n="manualProbe"></button>
      <span id="probe-state" class="muted"></span>
    </div>
  </section>

  <section id="screen-done" class="hidden">
    <h1 data-i18n="doneHead"></h1>
    <div class="card">
      <p data-i18n="doneText"></p>
      <div class="row">
        <button class="primary" id="btn-submit" data-i18n="submit"></button>
        <span class="mono" id="submit-state"></span>
      </div>
      <p class="muted mono" id="done-meta"></p>
      <div class="row hidden" id="fallback-row">
        <p class="muted" data-i18n="submitFailNote"></p>
      </div>
      <div class="row hidden" id="fallback-btn-row">
        <button id="btn-download" data-i18n="download"></button>
      </div>
    </div>
  </section>

  <!-- Static form for Netlify's build-time form detection. Never shown or
       submitted directly; runtime data is POSTed with the same field names

       input "name" attributes in sync with that function. -->
  <form name="intent-study" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="intent-study" />
    <input type="text" name="pid" />
    <input type="text" name="gender" />
    <input type="text" name="age" />
    <input type="text" name="driverLicense" />
    <input type="text" name="lang" />
    <textarea name="payload"></textarea>
    <input name="bot-field" />
  </form>
</div>

/* ================= utilities ================= */
const $ = (id) => document.getElementById(id);
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function lerp(a, b, f){ return a + (b - a) * f; }
function lerpAngle(a, b, f){ let d = ((b - a + 540) % 360) - 180; return a + d * f; }
function angDiff(a, b){ return ((b - a + 540) % 360) - 180; }

/* ---- blocked randomization: each repeat is a full shuffled pass over all
   scenes, so within one pass no scene repeats, and passes are stitched so a
   scene never lands at the very start of the next pass right after itself
   at the end of the previous one. This keeps repeats of the same scene far
   apart rather than merely non-adjacent. ---- */
function buildOrder(sceneCount, reps, rnd){
  const blocks = [];
  for (let r = 0; r < reps; r++) blocks.push(shuffle([...Array(sceneCount).keys()], rnd));
  for (let i = 0; i < blocks.length - 1; i++){
    const prev = blocks[i], next = blocks[i + 1];
    if (prev[prev.length - 1] === next[0]){
      for (let k = 1; k < next.length; k++){
        if (next[k] !== prev[prev.length - 1]){ [next[0], next[k]] = [next[k], next[0]]; break; }
      }
    }
  }
  return blocks.flat();
}

/* ================= rendering ================= */
const cv = $("stage"), ctx = cv.getContext("2d");
const WORLD = { x0:-1650, x1:1650, y0:-250, y1:3350 };
function toScreen(x, y){
  return [(x - WORLD.x0) / (WORLD.x1 - WORLD.x0) * cv.width,
          (1 - (y - WORLD.y0) / (WORLD.y1 - WORLD.y0)) * cv.height];
}
function posAt(trial, t){
  const s = trial.samples;
  if (t <= s[0][0]) return s[0];
  const last = s[s.length - 1];
  if (t >= last[0]) return last;
  let i = 1; while (s[i][0] < t) i++;
  const a = s[i - 1], b = s[i], f = (t - a[0]) / (b[0] - a[0]);
  return [t, lerp(a[1], b[1], f), lerp(a[2], b[2], f), lerpAngle(a[3], b[3], f)];
}
/* Reads position/heading around t and turns the finite differences into
   velocity, angular velocity, acceleration and angular acceleration. */
function kinematicsAt(trial, t){
  const h = 0.25;
  const velAt = (tt) => {
    const a = Math.max(0, tt - h), b = Math.min(trial.duration, tt + h), d = (b - a) || (2 * h);
    const pa = posAt(trial, a), pb = posAt(trial, b);
    return [(pb[1] - pa[1]) / d, (pb[2] - pa[2]) / d, angDiff(pa[3], pb[3]) / d];
  };
  const p0 = posAt(trial, t);
  const v0 = velAt(t);
  const tm = Math.max(0, t - h), tp = Math.min(trial.duration, t + h), d2 = (tp - tm) || (2 * h);
  const vm = velAt(tm), vp = velAt(tp);
  const rad = p0[3] * Math.PI / 180;
  return {
    t: +t.toFixed(2), x: +p0[1].toFixed(3), y: +p0[2].toFixed(3),
    vx: +v0[0].toFixed(4), vy: +v0[1].toFixed(4),
    omega_deg_s: +v0[2].toFixed(4),
    ax: +((vp[0] - vm[0]) / d2).toFixed(4), ay: +((vp[1] - vm[1]) / d2).toFixed(4),
    alpha_deg_s2: +((vp[2] - vm[2]) / d2).toFixed(4),
    heading_deg: +p0[3].toFixed(3),
    heading_unit: [+Math.cos(rad).toFixed(4), +Math.sin(rad).toFixed(4)]
  };
}
function trajectoryPerSecond(trial){
  const out = [];
  for (let t = 0; t <= trial.duration; t++) out.push(kinematicsAt(trial, t));
  return out;
}
function sampleAt(t){ return posAt(cur, t); }
function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "#1C2027"; ctx.lineWidth = 1;
  for (let gx = -1500; gx <= 1500; gx += 500){ const [sx] = toScreen(gx, 0); ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, cv.height); ctx.stroke(); }
  for (let gy = 0; gy <= 3000; gy += 500){ const [, sy] = toScreen(0, gy); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cv.width, sy); ctx.stroke(); }
  const ob = cur.truth.obstacle;
  if (ob && cur.obstacleVisible !== false){
    const [ox, oy] = toScreen(ob[0], ob[1]); const r = ob[2] / (WORLD.x1 - WORLD.x0) * cv.width;
    ctx.fillStyle = "rgba(120,128,138,0.28)"; ctx.strokeStyle = "rgba(150,158,168,0.7)"; ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(ox, oy, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.font = "600 24px ui-monospace, monospace";
  for (const g of DATA.scene.goals){
    const [gx, gy] = toScreen(g.x, g.y);
    ctx.strokeStyle = "#8E99A6"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(gx, gy, 15, 0, 7); ctx.stroke();
    ctx.fillStyle = "#B7C0CA"; ctx.fillText(g.id, gx + 22, gy + 8);
  }
  if (CONFIG.TRAIL){
    ctx.strokeStyle = "rgba(124,141,163,0.85)"; ctx.lineWidth = 2; ctx.beginPath();
    let started = false;
    for (const s of cur.samples){
      if (s[0] > worldT) break;
      const [sx, sy] = toScreen(s[1], s[2]);
      if (!started){ ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
    }
    const nowS = sampleAt(worldT); const [nx, ny] = toScreen(nowS[1], nowS[2]);
    if (started) ctx.lineTo(nx, ny);
    ctx.stroke();
  }
  const s = sampleAt(worldT);
  const [ax, ay] = toScreen(s[1], s[2]);
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.PI / 2 - s[3] * Math.PI / 180);
  ctx.fillStyle = "#F4F6F8"; ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(8.5, 11); ctx.lineTo(-8.5, 11); ctx.closePath(); ctx.fill();
  ctx.restore();
  $("trial-clock").textContent = `t = ${Math.floor(worldT)} s`;
}

/* ================= playback ================= */
function tick(ts){
  if (!playing) return;
  if (lastTs === null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.1); lastTs = ts;
  worldT += dt * CONFIG.TIME_SCALE;
  if (worldT >= cur.duration){ worldT = cur.duration; draw(); endTrialPlayback(); return; }
  if (worldT >= nextProbe){ draw(); openProbe(false); return; }
  draw(); requestAnimationFrame(tick);
}
function resume(){ playing = true; lastTs = null; $("btn-manual-probe").disabled = false; requestAnimationFrame(tick); }

/* Builds the seven post-trial questions once into #retro-extra.
   Six are 1-7 scale items: a horizontal row of number buttons plus text
   labels shown only at the two ends and the midpoint (position 4), not on
   every step. The "futureDirs" item is a plain multiple choice with all
   five options written out in full, kept as a vertical radio list. Answers
   for both formats are tracked in postAnswers[key] so retroReady() can
   check every question has been answered regardless of control type. */
function buildPostQuestions(){
  const host = $("retro-extra");
  host.innerHTML = "";
  for (const q of S.postQ){
    const block = document.createElement("div"); block.className = "q-block";
    const p = document.createElement("p"); p.className = "q-text"; p.textContent = q.text; block.appendChild(p);
    if (q.note){ const note = document.createElement("p"); note.className = "muted"; note.textContent = q.note; block.appendChild(note); }
    if (q.type === "scale"){
      const row = document.createElement("div"); row.className = "scale-row";
      const btnRow = document.createElement("div"); btnRow.className = "scale-buttons";
      q.labels.forEach((_, i) => {
        const v = String(i + 1);
        const btn = document.createElement("button");
        btn.type = "button"; btn.textContent = v; btn.dataset.v = v;
        btn.addEventListener("click", () => {
          for (const b of btnRow.querySelectorAll("button")) b.classList.remove("sel");
          btn.classList.add("sel"); postAnswers[q.key] = v; retroReady();
        });
        btnRow.appendChild(btn);
      });
      const caps = document.createElement("div"); caps.className = "scale-caps";
      for (const txt of [q.labels[0], q.labels[3], q.labels[6]]){
        const span = document.createElement("span"); span.textContent = txt; caps.appendChild(span);
      }
      row.appendChild(btnRow); row.appendChild(caps); block.appendChild(row);
    } else {
      for (const [value, label] of q.options){
        const lab = document.createElement("label"); lab.className = "retro-opt";
        const inp = document.createElement("input");
        inp.type = "radio"; inp.name = "q_" + q.key; inp.value = value;
        inp.addEventListener("change", () => { postAnswers[q.key] = value; retroReady(); });
        const span = document.createElement("span"); span.textContent = label;
        lab.appendChild(inp); lab.appendChild(span); block.appendChild(lab);
      }
    }
    host.appendChild(block);
  }
}

  for (const b of $("retro-goals").querySelectorAll("button")) b.classList.remove("sel");
  for (const r of document.querySelectorAll("input[name=retro]")) r.checked = false;
  for (const b of $("retro-extra").querySelectorAll(".scale-buttons button")) b.classList.remove("sel");
  for (const r of $("retro-extra").querySelectorAll("input[type=radio]")) r.checked = false;
  $("btn-retro-ok").disabled = true; $("retro").classList.remove("hidden");
}
function retroReady(){
  const p = document.querySelector("input[name=retro]:checked");
  $("btn-retro-ok").disabled = !(p && retroGoal && postQComplete());
}
for (const r of document.querySelectorAll("input[name=retro]")) r.addEventListener("change", retroReady);
for (const b of $("retro-goals").querySelectorAll("button")){
  b.addEventListener("click", () => { retroGoal = b.dataset.g; for (const x of $("retro-goals").querySelectorAll("button")) x.classList.toggle("sel", x === b); retroReady(); });
}
$("btn-retro-ok").addEventListener("click", () => {
  const p = document.querySelector("input[name=retro]:checked");
  curRec.retro = { explain: p.value, finalGoal: retroGoal };
  for (const q of S.postQ) curRec.retro[q.key] = postAnswers[q.key];
  curRec.durMs = Date.now() - curRec._t0; delete curRec._t0;
  record.trials.push(curRec); saveLocalBackup(record); $("retro").classList.add("hidden"); cursor += 1; nextTrial();
});

/* ================= trial flow ================= */
function resetSliders(){ for (const k of ["A", "B", "C", "M"]){ $("s-" + k).value = 0; $("v-" + k).textContent = "0"; } }
function ensureTrajectory(sceneId, trial){ if (!PRESET_TRAJ[sceneId]) PRESET_TRAJ[sceneId] = trajectoryPerSecond(trial); }
function startTrial(trial, label, sceneId, rep){
  cur = trial; curRec = { sceneId, rep, order: cursor, obstacleVisible: !!trial.truth.obstacle && trial.obstacleVisible !== false, probes: [], retro: null, _t0: Date.now() };
  ensureTrajectory(sceneId, trial);
  worldT = 0; nextProbe = CONFIG.PROBE_INTERVAL;
  $("probe-state").textContent = ""; $("trial-title").textContent = label;
  resetSliders(); draw(); resume();
}
function nextTrial(){
  if (cursor >= order.length){ finish(); return; }
  const idx = order[cursor];
  if (idx === -1) startTrial(DATA.practice, S.practice, DATA.practice.id, 0);
  else{
    const trial = DATA.trials[idx];
    const rep = repCounter[idx] = (repCounter[idx] || 0) + 1;
    startTrial(trial, S.trial(cursor, order.length - 1), trial.id, rep);
  }
}

/* ================= local safety backup ================= */
const BACKUP_KEY = "intent-study-pending";
function saveLocalBackup(rec){
  if (!rec) return;
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(rec)); }
  catch (err) { console.warn("Local backup failed:", err); }
}
function clearLocalBackup(){
  try { localStorage.removeItem(BACKUP_KEY); }
  catch (err) { console.warn("Could not clear local backup:", err); }
}

/* ================= finish & submit ================= */
function finish(){
  $("screen-trial").classList.add("hidden"); $("screen-done").classList.remove("hidden");
  record.finishedAt = new Date().toISOString();
  record.presetTrajectories = PRESET_TRAJ;
  saveLocalBackup(record);
  $("done-meta").textContent = `${record.pid} · ${record.lang} · ${record.trials.length} trials`;
  window.__lastRecord = record;
}
/* Packages the record as one JSON string carried in a single "payload"
   field, plus a handful of readable columns (pid/gender/age/license/lang)
   for quick scanning in the Netlify dashboard, and POSTs it as a
   Netlify Forms submission. Netlify Forms requires URL-encoded bodies
   (JSON is not accepted directly) and a form-name field matching the
   static <form> declared elsewhere in this file.
   presetTrajectories is identical across every participant (it's a fixed
   property of the scenes, not something they generate), so it is left out
   of the submitted payload to keep each submission small — it only needs
   to be reconstructed once from the scene definitions in this file, not
   stored again per participant. It is still included in the local-backup
   download so that file stays fully self-contained. */
async function submitToNetlify(rec){
  const { presetTrajectories, ...participantData } = rec;
  const body = new URLSearchParams();
  body.append("form-name", "intent-study");
  body.append("pid", rec.pid);
  body.append("gender", rec.gender);
  body.append("age", String(rec.age));
  body.append("driverLicense", rec.driverLicense);
  body.append("lang", rec.lang);
  body.append("payload", JSON.stringify(participantData));
  const res = await fetch("/", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString()
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}
$("btn-submit").addEventListener("click", async () => {
  $("btn-submit").disabled = true;
  $("submit-state").textContent = S.submitting;
  try {
    saveLocalBackup(record);
    await submitToNetlify(record);
    clearLocalBackup();
    $("submit-state").textContent = S.submitOk;
  } catch (err) {
    console.error("Netlify submission failed:", err);
    $("submit-state").textContent = S.submitFail;
    $("fallback-row").classList.remove("hidden");
    $("fallback-btn-row").classList.remove("hidden");
    $("btn-submit").disabled = false;
  }
});
$("btn-download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(record, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `intent_${record.pid}_${record.lang}.json`; a.click(); URL.revokeObjectURL(a.href);
});

/* ================= intro wiring ================= */
let license = null;
for (const b of $("license-row").querySelectorAll("button")){
  b.addEventListener("click", () => {
    license = b.dataset.v;
    for (const x of $("license-row").querySelectorAll("button")) x.classList.toggle("sel", x === b);
    checkReady();
  });
}
function checkReady(){
  const ageVal = +$("age").value;
  const ready = $("pid").value.trim() && $("gender").value && ageVal >= 1 && ageVal <= 120 && license;
  $("btn-start").disabled = !ready;
}
$("pid").addEventListener("input", checkReady);
$("gender").addEventListener("change", checkReady);
$("age").addEventListener("input", checkReady);
let repCounter = {};
const PRESET_TRAJ = {};
$("btn-start").addEventListener("click", () => {
  pid = $("pid").value.trim();
  const rnd = mulberry32(hashStr(pid));
  order = buildOrder(DATA.trials.length, CONFIG.REPEATS, rnd);
  order.unshift(-1);
  repCounter = {};
  record = { pid, gender: $("gender").value, age: +$("age").value, driverLicense: license,
             lang: LANG, timeScale: CONFIG.TIME_SCALE, probeInterval: CONFIG.PROBE_INTERVAL,
             startedAt: new Date().toISOString(), ua: navigator.userAgent,
             scene: { origin: { x: 0, y: 0 }, goals: DATA.scene.goals }, trials: [] };
  cursor = 0; $("screen-intro").classList.add("hidden"); $("screen-trial").classList.remove("hidden"); nextTrial();
});

/* ================= demo shortcuts (?demo=1 only) ================= */
if (DEMO){
  document.addEventListener("keydown", (e) => {
    if (!cur || $("screen-trial").classList.contains("hidden")) return;
    if (e.key === "s" || e.key === "S"){
      $("probe").classList.add("hidden");
      playing = false; worldT = cur.duration; nextProbe = Infinity; draw(); endTrialPlayback();
    }
    if (e.key === "f" || e.key === "F"){ CONFIG.TIME_SCALE = CONFIG.TIME_SCALE === 8 ? 24 : 8; }
  });
}

/* ================= boot ================= */
{
  if (params.get("pid")) { $("pid").value = params.get("pid"); }
  checkReady();
}
</script>
